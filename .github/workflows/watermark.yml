name: Watermark Worker Service Node

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ start_worker ]

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4
        with:
          repository: "akshaym118/watermark-server"
          ref: "main"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install FFmpeg & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg wget curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Watermark Worker
        env:
          COLAB_SECRET: "6a0c61b5673956cb73f851d0"
          KOYEB_URL: "https://sick-nikaniki-shubham8208989-6d7c863a.koyeb.app"
          IDLE_TIMEOUT: "600"
        run: |
          python main.py
